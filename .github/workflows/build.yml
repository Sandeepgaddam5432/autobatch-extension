name: Build side panel

# The maintainer cannot run Node locally, so CI is the build machine: it compiles
# the React panel and commits dist/sidepanel back to main. Downloading the repo
# ZIP is then enough to load the extension unpacked.

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "src/core/**"
      - "src/adapters/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-panel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # no lockfile is committed, so install rather than ci
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify output
        run: |
          test -f dist/sidepanel/index.html || {
            echo "::error::dist/sidepanel/index.html missing"
            ls -R dist || true
            exit 1
          }
          ls -R dist/sidepanel

      - name: Commit build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/sidepanel
          if git diff --cached --quiet; then
            echo "No build changes."
            exit 0
          fi
          git commit -m "build: side panel bundle [skip ci]"
          git push
