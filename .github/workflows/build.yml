name: Build side panel

# CI is the build machine: the maintainer cannot run Node locally.
#
# Two rules keep installs working on browsers that install an extension by
# picking a zip file directly:
#
# 1. manifest.json must sit at the archive ROOT. GitHub's "Download ZIP" button
#    nests everything under <repo>-main/, which such loaders reject.
# 2. The manifest must not reference paths that a loader may treat as unusual.
#    The panel therefore stays at src/sidepanel/index.html - the exact path that
#    loaded successfully before - and CI writes the compiled bundle there.

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "src/**"
      - "_locales/**"
      - "manifest.json"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-panel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # no lockfile is committed, so install rather than ci
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Move the compiled panel to src/sidepanel
        run: |
          test -f dist/sidepanel/index.html || {
            echo "::error::vite did not emit dist/sidepanel/index.html"
            ls -R dist || true
            exit 1
          }
          rm -rf src/sidepanel
          mkdir -p src/sidepanel
          cp -r dist/sidepanel/. src/sidepanel/
          rm -rf dist
          ls -R src/sidepanel

      - name: Commit build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/sidepanel dist 2>/dev/null || git add -A src/sidepanel
          if git diff --cached --quiet; then
            echo "No build changes."
          else
            git commit -m "build: side panel bundle [skip ci]"
            git push
          fi

      - name: Package install-ready zip
        run: |
          rm -rf package unq-automation.zip
          mkdir -p package

          # runtime files only, manifest at the archive root
          cp manifest.json package/
          cp -r src package/
          [ -d _locales ] && cp -r _locales package/
          [ -d icons ] && cp -r icons package/
          [ -f selectors.example.json ] && cp selectors.example.json package/

          cd package
          zip -r ../unq-automation.zip . -x "*.DS_Store"
          cd ..
          unzip -l unq-automation.zip

      - name: Verify the archive layout
        run: |
          # manifest at the root
          unzip -l unq-automation.zip | grep -qE " manifest\\.json$" || {
            echo "::error::manifest.json is not at the archive root"
            exit 1
          }

          # every manifest-referenced entry point is present
          for path in src/sidepanel/index.html src/background.js src/content/content.js; do
            unzip -l unq-automation.zip | grep -qE " $path$" || {
              echo "::error::$path is missing from the archive"
              exit 1
            }
          done

          # the panel's own asset references resolve inside the archive
          unzip -p unq-automation.zip src/sidepanel/index.html

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: unq-automation-zip
          path: unq-automation.zip

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          NOTES="Install-ready build. manifest.json is at the archive root and the side panel stays at src/sidepanel/index.html, so the zip can be selected directly in the browser's extension page. Version ${VERSION}, commit ${GITHUB_SHA}."

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "UnQ Automation ${VERSION}" --notes "$NOTES"
            gh release upload latest unq-automation.zip --clobber
          else
            gh release create latest unq-automation.zip \
              --title "UnQ Automation ${VERSION}" \
              --notes "$NOTES"
          fi
