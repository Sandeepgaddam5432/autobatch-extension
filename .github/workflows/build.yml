name: Build side panel

# CI is the build machine: the maintainer cannot run Node locally.
#
# The archive must match the shape of the last build that installed successfully
# on the target browser (an Android browser that installs an extension by
# selecting a zip file):
#
# 1. manifest.json sits at the archive ROOT. GitHub's "Download ZIP" button
#    nests everything under <repo>-main/, which such loaders reject.
# 2. The panel stays at src/sidepanel/index.html - the path that loaded before.
#    CI writes the compiled bundle there.
# 3. Localization is all-or-nothing. _locales ships AND manifest declares
#    default_locale. Either one alone makes Chromium refuse the install.
# 4. The asset filename carries version and commit, so a cached download can
#    never be mistaken for a newer build.

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "src/**"
      - "_locales/**"
      - "manifest.json"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-panel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # no lockfile is committed, so install rather than ci
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Move the compiled panel to src/sidepanel
        run: |
          test -f dist/sidepanel/index.html || {
            echo "::error::vite did not emit dist/sidepanel/index.html"
            ls -R dist || true
            exit 1
          }
          rm -rf src/sidepanel
          mkdir -p src/sidepanel
          cp -r dist/sidepanel/. src/sidepanel/
          rm -rf dist
          ls -R src/sidepanel

      - name: Fail if the panel is not the compiled bundle
        run: |
          grep -q "./assets/index-" src/sidepanel/index.html || {
            echo "::error::src/sidepanel/index.html is not the compiled bundle"
            cat src/sidepanel/index.html
            exit 1
          }
          if [ -f src/sidepanel/panel.js ]; then
            echo "::error::the superseded panel.js is still present"
            exit 1
          fi

      - name: Commit build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/sidepanel
          if git diff --cached --quiet; then
            echo "No build changes."
          else
            git commit -m "build: side panel bundle [skip ci]"
            git push
          fi

      - name: Resolve build identity
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          SHORT=$(git rev-parse --short HEAD)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
          echo "ZIP_NAME=unq-automation-$VERSION-$SHORT.zip" >> "$GITHUB_ENV"

      - name: Package install-ready zip
        run: |
          rm -rf package ./*.zip
          mkdir -p package

          # runtime files only, manifest at the archive root
          cp manifest.json package/
          cp -r src package/
          cp -r _locales package/
          [ -d icons ] && cp -r icons package/
          [ -f selectors.example.json ] && cp selectors.example.json package/

          cd package
          zip -r "../$ZIP_NAME" . -x "*.DS_Store"
          cd ..
          unzip -l "$ZIP_NAME"

      - name: Verify the archive layout
        run: |
          # manifest at the root
          unzip -l "$ZIP_NAME" | grep -qE " manifest\\.json$" || {
            echo "::error::manifest.json is not at the archive root"
            exit 1
          }

          # every manifest-referenced entry point is present
          for path in src/sidepanel/index.html src/background.js src/content/content.js; do
            unzip -l "$ZIP_NAME" | grep -qE " $path$" || {
              echo "::error::$path is missing from the archive"
              exit 1
            }
          done

          # the archived panel is the compiled one
          unzip -p "$ZIP_NAME" src/sidepanel/index.html | grep -q "./assets/index-" || {
            echo "::error::the archived panel is not the compiled bundle"
            exit 1
          }

          # localization must be all-or-nothing
          HAS_LOCALES=$(unzip -l "$ZIP_NAME" | grep -c "_locales/en/messages.json" || true)
          HAS_DEFAULT=$(node -p "require('./manifest.json').default_locale ? 1 : 0")
          if [ "$HAS_LOCALES" -eq 0 ] || [ "$HAS_DEFAULT" -eq 0 ]; then
            echo "::error::localization is half-configured: _locales/en/messages.json present=$HAS_LOCALES, default_locale set=$HAS_DEFAULT"
            exit 1
          fi

          # every __MSG_ placeholder in the manifest must resolve in the default locale
          unzip -p "$ZIP_NAME" manifest.json > /tmp/archived-manifest.json
          unzip -p "$ZIP_NAME" _locales/en/messages.json > /tmp/archived-messages.json
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/archived-manifest.json', 'utf8');
            const manifest = JSON.parse(raw);
            const messages = JSON.parse(fs.readFileSync('/tmp/archived-messages.json', 'utf8'));
            if (manifest.version !== process.env.VERSION) {
              console.error('::error::archived manifest version mismatch');
              process.exit(1);
            }
            const missing = [...raw.matchAll(/__MSG_([A-Za-z0-9_]+)__/g)]
              .map((match) => match[1])
              .filter((key) => !messages[key] || !messages[key].message);
            if (missing.length) {
              console.error('::error::unresolved manifest placeholders: ' + missing.join(', '));
              process.exit(1);
            }
            console.log('archived manifest', manifest.version, 'placeholders resolved');
          "

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: unq-automation-zip
          path: ${{ env.ZIP_NAME }}

      - name: Publish releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Install-ready build.

          - Extension version: $VERSION
          - Commit: $SHORT
          - Asset: $ZIP_NAME

          The archive matches the layout of the last build that installed successfully: manifest.json at the root, panel at src/sidepanel/index.html, _locales shipped alongside default_locale. Select this zip directly on the browser's extension page."

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "UnQ Automation $VERSION" --notes "$NOTES"
          else
            gh release create latest --title "UnQ Automation $VERSION" --notes "$NOTES"
          fi
          gh release upload latest "$ZIP_NAME" --clobber

          TAG="v$VERSION-$SHORT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" --clobber
          else
            gh release create "$TAG" "$ZIP_NAME" --title "UnQ Automation $VERSION ($SHORT)" --notes "$NOTES"
          fi
